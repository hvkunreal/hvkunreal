<section class="page">
  <h1>Formulaire de candidature</h1>

  <form id="form-candidature">
    <label>Dans quel rôle souhaitez-vous postuler ? *</label>

<div class="radio-group">
    <label>
    <input type="radio" name="role" value="Animateur Discord" required>
    Animateur Discord
  </label>

    <label>
    <input type="radio" name="role" value="Modérateur Discord">
    Modérateur Discord
  </label>

    <label>
    <input type="radio" name="role" value="Modérateur Stream">
    Modérateur Stream
  </label>
</div>

    <br><br>

    <label>Votre Adresse Email *</label>
    <input type="text" name="adressmail" required>

    <br><br>

    <label>Votre pseudo Discord *</label>
    <input type="text" name="discordName" required>

    <br><br>

    <label>Votre identifiant Discord *</label>
    <input type="text" name="discordID" required>

    <br><br>

    <label>Votre âge *</label>
    <input type="number" name="age" required>

    <br><br>

    <label>Présentez-vous (prénom, études, loisirs...) *</label>
    <textarea name="presentation" required></textarea>

    <br><br>

    <label>Vos motivations (développez bien) *</label>
    <textarea name="motivation" required></textarea>

    <br><br>

    <label>Vos qualités ainsi que vos défauts *</label>
    <textarea name="qualities" required></textarea>

    <br><br>

    <label>Pourquoi vous et pas un autre ? *</label>
    <textarea name="whyYou" required></textarea>

    <br><br>

    <label>Vos disponibilités *</label>
    <textarea name="availability" required></textarea>

    <br><br>

    <label>Selon vous, qu'est-ce qu'un modérateur ? *</label>
    <textarea name="moderatorDefinition" required></textarea>

    <br><br>

    <label>Quelles sont les qualités requises pour devenir modérateur ? *</label>
    <textarea name="moderatorQualities" required></textarea>

    <br><br>

    <label>Avez-vous déjà modéré sur Discord ? Si oui, quel(s) serveur(s) ? *</label>
    <textarea name="moderationExperience" required></textarea>

    <br><br>

    <label>Définissez l'impartialité avec vos propres mots *</label>
    <textarea name="impartiality" required></textarea>

    <br><br>

    <label>Avez-vous un dernier message à ajouter ?</label>
    <textarea name="lastMessage"></textarea>

    <br><br>

    <button type="submit">Envoyer</button>
  </form>

  <p id="success-msg" style="display:none; color:#38bdf8; margin-top:15px;">
    Merci ! Votre candidature a été enregistrée.
  </p>
</section>
